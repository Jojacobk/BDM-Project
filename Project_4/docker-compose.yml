name: rico-project-4

x-airflow-common: &airflow-common
  build:
    context: ./airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-rico}:${POSTGRES_PASSWORD:-rico}@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "5"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    PYTHONPATH: /opt/airflow/src
    POSTGRES_DSN: postgresql://${POSTGRES_USER:-rico}:${POSTGRES_PASSWORD:-rico}@postgres:5432/${POSTGRES_DB:-rico}
    MINIO_URL: http://storage:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    MINIO_BUCKET: ${MINIO_BUCKET:-rico-raw}
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    RICO_DEFAULT_LIMIT: ${RICO_DEFAULT_LIMIT:-5}
    GIT_SHA: ${GIT_SHA:-unknown}
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    SLACK_WEBHOOK_CONN_ID: ${SLACK_WEBHOOK_CONN_ID:-}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./prompts:/opt/airflow/prompts:ro
    - ./config:/opt/airflow/config:ro
    - ./tests:/opt/airflow/tests:ro
    - ./migrations:/opt/airflow/migrations:ro
  depends_on:
    postgres:
      condition: service_healthy
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - rico-net

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rico}
      POSTGRES_USER: ${POSTGRES_USER:-rico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rico}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rico} -d ${POSTGRES_DB:-rico}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rico-net

  storage:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rico-net

  mc:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-rico-raw} &&
      echo 'minio bucket ready'
      "
    restart: "no"
    networks:
      - rico-net

  ollama:
    image: ollama/ollama:0.5.4
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama --version >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rico-net

  ollama-init:
    image: ollama/ollama:0.5.4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: >
      /bin/sh -c "ollama pull ${OLLAMA_MODEL:-qwen2.5:3b} && echo 'ollama model ready'"
    restart: "no"
    networks:
      - rico-net

  airflow-init:
    <<: *airflow-common
    entrypoint:
      - /bin/bash
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username airflow --password airflow \
          --firstname RICO --lastname Admin \
          --role Admin --email rico@example.com || true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mc:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mc:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --limit 1 >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  backfill-agent:
    build:
      context: .
      dockerfile: bonus_backfill_agent/Dockerfile
    profiles:
      - agent
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      AIRFLOW_BASE_URL: ${AIRFLOW_BASE_URL:-http://airflow-webserver:8080}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
      AIRFLOW_DAG_ID: ${AIRFLOW_DAG_ID:-rico_production_pipeline}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      BACKFILL_MAX_LIMIT: ${BACKFILL_MAX_LIMIT:-50}
    depends_on:
      airflow-webserver:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - rico-net

volumes:
  postgres-data:
  minio-data:
  ollama-data:

networks:
  rico-net:
    driver: bridge
