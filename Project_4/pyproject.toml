[project]
name = "rico_pipeline"
version = "0.1.0"
description = "Production RICO multimodal pipeline (Airflow)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rico_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: requires the live docker-compose stack"]
