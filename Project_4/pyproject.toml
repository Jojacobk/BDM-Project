[project]
name = "rico-production-pipeline"
version = "0.1.0"
description = "Project 4: production-style RICO Airflow pipeline with traceability, audit, metrics, and Slack notifications."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<1.35",
    "botocore>=1.34.70,<1.34.132",
    "datasets<3",
    "fsspec<2024.4",
    "huggingface-hub<0.24",
    "numpy>=1.26",
    "open-clip-torch>=2.30",
    "pgvector>=0.3",
    "pillow>=10.0",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
airflow = [
    "apache-airflow==2.9.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
